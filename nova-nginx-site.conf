server {
    server_name nova.mysimpleaihelp.com;
    root /var/www/nova;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/token {
        proxy_pass http://127.0.0.1:8787/api/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nova.mysimpleaihelp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nova.mysimpleaihelp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = nova.mysimpleaihelp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name nova.mysimpleaihelp.com;
    return 404; # managed by Certbot


}
