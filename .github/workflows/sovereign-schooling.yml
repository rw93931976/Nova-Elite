# DISABLED 2026-05-18: Ray paused all autonomous schooling (API cost).
# Re-enable schedule + workflow_dispatch when NotebookLM archival is wired.
name: Nova Sovereign Schooling

on:
  workflow_dispatch:

jobs:
  schooling:
    if: false # Hard stop: no API burn until NotebookLM homework archival is wired.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allow pushing updates to syllabus/vault

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: "Intense Study & Notebook Sync"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SESSION_COOKIE: ${{ secrets.GOOGLE_SESSION_COOKIE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          node scripts/autonomous_schooling.cjs

      - name: "Commit & Push Progress"
        run: |
          git config --global user.name "Nova Sovereign"
          git config --global user.email "nova@elite-shielded.ai"
          git add SYLLABUS_DOCTORATE.md nova-data/library/solutions_vault.md
          git commit -m "🛸 [Sovereign Schooling] Cycle Complete (v9.5)" || echo "No changes to commit"
          git push
